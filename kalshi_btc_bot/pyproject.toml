[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-btc-bot"
version = "0.1.0"
description = "Kalshi BTC Hybrid Bot – Market-Make + Sniper"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tyler"}]

dependencies = [
    "httpx[http2]>=0.27",
    "websockets>=12.0",
    "cryptography>=42.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bot = "bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
